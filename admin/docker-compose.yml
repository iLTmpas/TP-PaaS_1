version: '3.8'

services:
  admin-ihm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Admin-IHM
    ports:
      - "9191:9191"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://104.198.175.147:5432/postgres}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-bUbis{(2LAv{V;Mf}
    restart: unless-stopped
    labels:
      logging: "promtail"
      environment: "production"

  # ============================================
  # PROMTAIL - Collecteur de logs pour Loki
  # ============================================
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - admin-ihm