version: "3.9"
services:
  core-backend:
    build:
      context: .
    container_name: core-backend
    ports:
      - "8085:8085"
    environment:
      SPRING_REDIS_SENTINEL_MASTER: mymaster
      SPRING_REDIS_SENTINEL_NODES: 172.31.250.176:26379,172.31.253.41:26379,172.31.253.41:26380
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 172.31.250.252:9092
    restart: on-failure
