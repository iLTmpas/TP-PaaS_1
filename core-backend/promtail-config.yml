server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://172.31.250.178:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Garder uniquement les conteneurs avec le label logging=promtail
      - source_labels: ['__meta_docker_container_label_logging']
        regex: promtail
        action: keep
      # Extraire le nom du conteneur
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Extraire le nom du service compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # Ajouter le label d'environnement
      - source_labels: ['__meta_docker_container_label_environment']
        target_label: env
    pipeline_stages:
      # Parser les logs JSON de Spring Boot
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            thread: thread
            timestamp: timestamp
            application: application
            stackTrace: stackTrace
      # Extraire le niveau de log comme label
      - labels:
          level:
          application:
          logger:
      # Reformater le message pour Grafana
      - output:
          source: message
      # Ajouter le timestamp du log
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000Z07:00"
          fallback_formats:
            - "2006-01-02T15:04:05.000Z"
            - "2006-01-02 15:04:05.000"
